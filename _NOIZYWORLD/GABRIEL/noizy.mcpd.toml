# ═══════════════════════════════════════════════════════════════════════════
#  NOIZY EMPIRE — MCP Fleet Configuration
#  .mcpd.toml · GABRIEL Crew Declaration
#  GOD.local · M2 Ultra 192GB · 10.90.90.10
#
#  "requirements.txt for agentic systems" — mozilla-ai/mcpd
#
#  Usage:
#    brew install mcpd           (or: brew tap mozilla-ai/tap && brew install mcpd)
#    cd ~/NOIZYLAB
#    mcpd init                   (creates .mcpd.toml — or use this file)
#    mcpd start                  (starts all servers on http://localhost:8090)
#    mcpd start --reload         (hot reload on SIGHUP — no restart needed)
#
#  HTTP API (once running):
#    curl http://localhost:8090/api/v1/servers/lucy-mcp/tools/lucy_status
#    curl -X POST http://localhost:8090/api/v1/servers/gabriel-mcp/tools/gabriel_speak \
#         -H "Content-Type: application/json" \
#         -d '{"text": "Overnight batch complete"}'
#
#  GABRIEL calls crew via Python:
#    import httpx
#    httpx.post("http://localhost:8090/api/v1/servers/lucy-mcp/tools/lucy_intake_receive",
#               json={"data": ..., "source": "gabriel"})
#
#  SIGHUP hot reload:
#    kill -HUP $(cat ~/.mcpd/mcpd.pid)
#
#  Docs: https://mozilla-ai.github.io/mcpd/
# ═══════════════════════════════════════════════════════════════════════════

# ── API SERVER ──────────────────────────────────────────────────────────────

[api]
addr = "127.0.0.1:8090"    # local only — Cloudflare Tunnel handles external

[api.timeout]
shutdown = "30s"

[api.cors]
enable = false              # no CORS needed — same-host only


# ── MCP TIMEOUTS ───────────────────────────────────────────────────────────

[mcp.timeout]
init = "30s"                # some agents need time to load Ollama models

[mcp.interval]
health = "30s"              # health check every 30s


