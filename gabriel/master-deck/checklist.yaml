  subtitle: "GABRIEL's Roadmap · Realtime Proof-of-Concept Ledger · Shared Surface for the AI Family"
  author: "Robert Stephen Plowman (RSP_001)"
  tagline: "GORUNFREE 4 ALL"
  # Wall line — the filter. One sentence that decides everything.
  mission: "Every creative person deserves their own NOIZY.ai."
  # Founder credo — the compass. Spoken in DreamChamber and Wisdom Project.
  founder_credo: "I want a world where every creative person has their own NOIZY.ai — their own trusted home for voice, memory, story, and creation. If that's true by 2056, I'll know the mission was accomplished."
  # Doctrine — the enforcement law that makes the mission real.
  doctrine: "Consent as executable code. Provenance as default. Revocation as sacred. Compensation as automatic."
