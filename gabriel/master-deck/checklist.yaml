  legacy_horizon: "2056"
  generated_for: "Plowman's DreamChamber — Claude, GABRIEL, LUCY, SHIRL, POPS, KEITH, DREAM, CB01, FAMILY, Copilot"

origin_story: |
  Built by one human, solo, with Claude + Copilot + AI family as collaborators.
  Self-taught AI from zero. Minimal funds. All coded after a near-paralyzing C3 spinal injury.
  This work saved RSP's life. The deck carries that weight as proof:
  if one human could build this under those constraints, creators everywhere can go run free.

