# ====================================================================
# NOIZYEMPIRE — CI security gate (GitHub Actions)
#
# Install: copy to .github/workflows/security.yml in every repo.
# This is the ENFORCED gate. Pre-commit hooks are convenience;
# this workflow is the law.
#
# Blocks merges on:
#   - Secret detection (TruffleHog + Gitleaks)
#   - Dockerfile linting (hadolint)
#   - Image vulnerability scan (Trivy, HIGH/CRITICAL)
#   - SBOM generation (Syft → uploaded as artifact)
#
# Runs on every PR and every push to main.
# ====================================================================

name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run catches newly-disclosed CVEs on the main branch
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  security-events: write  # for uploading SARIF to code scanning
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------- Secret scanning ----------
  secrets:
    name: Secret scan (Gitleaks + TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for scanning full git history

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        # No license key required for public repos. For private repos,
        # set GITLEAKS_LICENSE secret. Otherwise use the OSS binary path.

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unknown --only-verified

  # ---------- Dockerfile linting ----------
  dockerfile-lint:
    name: Hadolint
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile*') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning
          ignore: DL3008,DL3009

  # ---------- Container vulnerability scan ----------
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile*') != ''
    needs: dockerfile-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t noizyempire/ci-scan:${{ github.sha }} .

      - name: Trivy — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: noizyempire/ci-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------- SBOM generation + artifact ----------
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile*') != ''
    needs: trivy-image
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild image (cached)
        run: docker build -t noizyempire/ci-scan:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: noizyempire/ci-scan:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90
