version: "3.9"

services:
  heaven:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./heaven-worker/src:/app/heaven-worker/src
      - heaven-data:/app/heaven-worker/.wrangler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  heaven-data:
