name = "sovereign-brain-edge"
main = "worker.js"
compatibility_date = "2024-11-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ECOSYSTEM = "NOIZY / FISH MUSIC INC"
COUNCIL_VERSION = "2.0.0"

[[d1_databases]]
binding = "DB"
database_name = "SOVEREIGN_BRAIN_D1"
database_id = "noizy-sovereign-brain-d1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SOVEREIGN_KV"
id = "noizy_sovereign_kv_prod"

[observability]
enabled = true
head_sampling_rate = 1.0
